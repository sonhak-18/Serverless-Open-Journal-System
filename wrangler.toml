name = "sektansia-press"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

# Cloudflare D1 Database Binding
# Eksekusi: npx wrangler d1 create sektansia-db
# Masukkan ID yang didapat ke database_id di bawah ini
[[d1_databases]]
binding = "DB"
database_name = "sektansia-db"
database_id = "YOUR_D1_DATABASE_ID"

# Cloudflare Workers KV Namespace Binding (Global Edge Cache & Real-Time Stats)
# Eksekusi: npx wrangler kv:namespace create CACHE
# Masukkan ID yang didapat ke id di bawah ini
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"
